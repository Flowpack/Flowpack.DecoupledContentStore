privilegeTargets:
  'Neos\Neos\Security\Authorization\Privilege\ModulePrivilege':
    'Flowpack.DecoupledContentStore:BackendModule':
      matcher: 'administration/contentstore'

  'Neos\Flow\Security\Authorization\Privilege\Method\MethodPrivilege':
    # Operating the switch which suppresses automatically triggered content releases. Separate from the module
    # privilege above, so an installation which lets editors watch the module can still restrict who may pause
    # releases and thereby stop everybody's publishes from going live.
    'Flowpack.DecoupledContentStore:ReleaseControl':
      matcher: 'method(Flowpack\DecoupledContentStore\Controller\BackendController->(pauseAutomaticReleases|resumeAutomaticReleases)Action())'

roles:
  'Neos.Neos:Administrator':
    privileges:
      -
        privilegeTarget: 'Flowpack.DecoupledContentStore:BackendModule'
        permission: GRANT
      -
        privilegeTarget: 'Flowpack.DecoupledContentStore:ReleaseControl'
        permission: GRANT
